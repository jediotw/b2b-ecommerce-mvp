spring:
  application:
    name: shop

  datasource:
    # Defaults target the local docker compose database (see compose.yaml).
    # LOCAL-DEVELOPMENT-ONLY password default; override via POSTGRES_PASSWORD.
    # SPRING_DATASOURCE_URL overrides the whole URL when set.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:shop}}
    username: ${POSTGRES_USER:shop}
    password: ${POSTGRES_PASSWORD:localdev}

  flyway:
    # Flyway owns schema changes; Hibernate only validates.
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  jackson:
    deserialization:
      # Jackson 3 defaults FAIL_ON_UNKNOWN_PROPERTIES to disabled and a per-class
      # @JsonIgnoreProperties(ignoreUnknown = false) cannot re-enable it; enabling
      # the feature rejects unknown request fields (typos, client-supplied "currency").
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      # Render framework-level errors (e.g. 405, 415) as RFC 7807 ProblemDetail too.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint.
        include: health
  health:
    db:
      # Database health indicator (reports the datasource status).
      enabled: true

shop:
  catalog:
    # Single MVP currency; returned on every product response. Clients cannot submit it.
    currency: INR
